name: Stan integration

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  threaded-smoke-test:
    runs-on: ubuntu-latest
    env:
      EPIKINETICS_RUN_STAN_TESTS: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Configure CmdStanR repository
        shell: Rscript {0}
        run: |
          cat(
            "\noptions(repos=c(stan='https://stan-dev.r-universe.dev', CRAN='https://cloud.r-project.org'))\n",
            file = "~/.Rprofile",
            append = TRUE
          )
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Install CmdStan
        shell: Rscript {0}
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = 2)
      - name: Run threaded integration test
        shell: Rscript {0}
        run: testthat::test_local(".", filter = "stan", load_package = "source")
