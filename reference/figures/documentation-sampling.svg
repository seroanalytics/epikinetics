<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Parallel chains and within-chain threads</title>
  <desc id="desc">Prepared data and one compiled Stan model feed four independent Markov chains. Within each chain, two worker threads evaluate participant groups, and retained draws are combined into one fit object.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#596773"/></marker>
    <style>
      .title { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#20262d; }
      .heading { font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#20262d; }
      .text { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#52606d; }
      .box { stroke:#cbd3da; stroke-width:1.3; rx:10; }
      .arrow { stroke:#596773; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <text x="500" y="34" text-anchor="middle" class="title">Parallel chains and participant-partitioned likelihoods</text>
  <rect x="45" y="135" width="190" height="90" fill="#eef6fb" class="box"/>
  <text x="140" y="170" text-anchor="middle" class="heading">Prepared data</text>
  <text x="140" y="195" text-anchor="middle" class="text">one compiled threaded model</text>
  <path d="M235 180 L300 180" class="arrow"/>

  <g>
    <rect x="305" y="67" width="390" height="58" fill="#f8f9fa" class="box"/><text x="330" y="92" class="heading">Chain 1</text><rect x="500" y="78" width="74" height="34" fill="#f1f8f2" class="box"/><rect x="590" y="78" width="74" height="34" fill="#f1f8f2" class="box"/><text x="537" y="100" text-anchor="middle" class="text">thread</text><text x="627" y="100" text-anchor="middle" class="text">thread</text>
    <rect x="305" y="135" width="390" height="58" fill="#f8f9fa" class="box"/><text x="330" y="160" class="heading">Chain 2</text><rect x="500" y="146" width="74" height="34" fill="#f1f8f2" class="box"/><rect x="590" y="146" width="74" height="34" fill="#f1f8f2" class="box"/><text x="537" y="168" text-anchor="middle" class="text">thread</text><text x="627" y="168" text-anchor="middle" class="text">thread</text>
    <rect x="305" y="203" width="390" height="58" fill="#f8f9fa" class="box"/><text x="330" y="228" class="heading">Chain 3</text><rect x="500" y="214" width="74" height="34" fill="#f1f8f2" class="box"/><rect x="590" y="214" width="74" height="34" fill="#f1f8f2" class="box"/><text x="537" y="236" text-anchor="middle" class="text">thread</text><text x="627" y="236" text-anchor="middle" class="text">thread</text>
    <rect x="305" y="271" width="390" height="58" fill="#f8f9fa" class="box"/><text x="330" y="296" class="heading">Chain 4</text><rect x="500" y="282" width="74" height="34" fill="#f1f8f2" class="box"/><rect x="590" y="282" width="74" height="34" fill="#f1f8f2" class="box"/><text x="537" y="304" text-anchor="middle" class="text">thread</text><text x="627" y="304" text-anchor="middle" class="text">thread</text>
  </g>
  <path d="M695 198 L760 198" class="arrow"/>
  <rect x="765" y="135" width="190" height="126" fill="#f5f3fa" class="box"/>
  <text x="860" y="172" text-anchor="middle" class="heading">epikinetics fit</text>
  <text x="860" y="199" text-anchor="middle" class="text">posterior draws</text>
  <text x="860" y="220" text-anchor="middle" class="text">diagnostics</text>
  <text x="860" y="241" text-anchor="middle" class="text">prediction metadata</text>
  <text x="500" y="365" text-anchor="middle" class="text">parallel_chains controls simultaneous chains; threads_per_chain controls workers inside each chain</text>
</svg>
